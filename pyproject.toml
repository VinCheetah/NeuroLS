[project]
name = "neurols"
version = "0.1.0"
description = "A modular, high-performance Local Search and Neuroevolution framework"
readme = "README.md"
authors = [
    { name = "Gardies", email = "vincentgardies03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "cma>=3.3.0",
    "cmaes>=0.11.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
neurols = "neurols.cli.app:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
